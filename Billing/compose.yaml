version: '3.8'

services:
  billing-web:
    build:
      context: .
      dockerfile: Billing.Web/Dockerfile
    container_name: billing-web
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped