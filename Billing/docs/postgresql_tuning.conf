# =============================================================
# PostgreSQL tuning для биллинга (high-write, medium-read)
# Рассчитано на сервер 4 CPU / 8 GB RAM
# Подключить: ALTER SYSTEM или postgresql.conf
# =============================================================

listen_addresses = '*'

# --- Память ---
shared_buffers = '256MB'                  # 25% RAM
effective_cache_size = '6GB'            # 75% RAM
work_mem = '32MB'                       # Для сортировок в GROUP BY
maintenance_work_mem = '512MB'          # Для CREATE INDEX, VACUUM

# --- WAL (Write-Ahead Log) ---
wal_buffers = '64MB'
max_wal_size = '4GB'
min_wal_size = '1GB'
wal_compression = 'zstd'               # PG15+: экономим диск
checkpoint_completion_target = 0.9
checkpoint_timeout = '15min'

# --- Планировщик ---
random_page_cost = 1.1                  # SSD
effective_io_concurrency = 200          # SSD
default_statistics_target = 200         # Точнее оценки для JOIN

# --- Параллелизм ---
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8
parallel_tuple_cost = 0.01
parallel_setup_cost = 100

# --- Подключения ---
max_connections = 200                   # Npgsql pool до 50 × N instances
idle_in_transaction_session_timeout = '30s'

# --- Autovacuum (агрессивнее для часто вставляемых таблиц) ---
autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_threshold = 1000
autovacuum_analyze_threshold = 500
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Логирование ---
log_min_duration_statement = 500        # Логировать запросы > 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
